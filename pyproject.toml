[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "day-trade-ai-platform"
version = "1.0.0"
description = "Plataforma de IA e automacao para Day Trade com telemetria e gestão de risco"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=9.0.0",
]

[project.scripts]
daytrade-ai = "src.cli.runner:main_cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]