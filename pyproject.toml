[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "day-trade-ai-platform"
version = "1.0.0"
description = "Plataforma de IA e automacao para DayTrade com telemetria e gestao de risco"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy>=1.24",
    "joblib>=1.3",
    "pytest>=9.0.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]
postgres = [
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
]
mt5 = ["MetaTrader5>=5.0"]
dev = [
    "pytest-cov>=4.0",
    "httpx>=0.27",
    "alembic>=1.13",
]

[project.scripts]
daytrade-ai = "src.cli.runner:main_cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]