name: Day Trade AI Platform - CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . pytest pytest-cov

    - name: Run Test Suite
      run: |
        pytest --maxfail=1 --disable-warnings

    - name: Verify Deployment Readiness
      run: |
        python -c "from src.deploy.orchestrator import DeploymentOrchestrator; readiness = DeploymentOrchestrator().verify_deployment_readiness(); print(readiness); assert readiness['ready'] is True"