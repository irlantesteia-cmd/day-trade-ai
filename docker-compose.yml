version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: day_trade_ai_platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs