version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: day_trade_ai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: daytrade
      POSTGRES_PASSWORD: daytrade
      POSTGRES_DB: daytrade
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daytrade -d daytrade"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: day_trade_ai_platform
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+psycopg2://daytrade:daytrade@db:5432/daytrade
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

volumes:
  pgdata: